<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CultivaUP – Gestión del huerto universitario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f3f4f6;--card:#fff;--tx:#1f2933;--mut:#617080;--pri:#1f5c3a;--on:#fff;--bd:#d9dee4;--bad:#b3261e;--warn:#9a5b00;--wbg:#fff3dc;--ok:#e3f1e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1712;--card:#18231c;--tx:#e6efe7;--mut:#9db2a1;--pri:#6cc07a;--on:#0f1712;--bd:#2c3d31;--bad:#ff8a80;--warn:#ffc266;--wbg:#33280f;--ok:#1d3322}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1712;--card:#18231c;--tx:#e6efe7;--mut:#9db2a1;--pri:#6cc07a;--on:#0f1712;--bd:#2c3d31;--bad:#ff8a80;--warn:#ffc266;--wbg:#33280f;--ok:#1d3322}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
header{background:var(--pri);color:var(--on);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
header h1{font-size:1.4rem;font-weight:800}header small{opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{white-space:nowrap;border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ok);color:var(--tx);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn,button{font:inherit}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:.9rem}tr:last-child td{border-bottom:0}
td button{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:3px 9px;cursor:pointer}
td button.del{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.stat b{display:block;font:800 1.9rem "Bricolage Grotesque",sans-serif;color:var(--pri)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:16px}
.al{background:var(--wbg);color:var(--warn);border-radius:8px;padding:8px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut)}.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--ok);font-size:.85rem}
.tag.p{background:var(--wbg);color:var(--warn)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;margin:8px 0;font-size:.92rem;color:var(--mut)}
input,select{width:100%;padding:8px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.row button{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer}
.um{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end}
.login{max-width:420px;margin:12vh auto;text-align:center}.login .box{text-align:left}
svg{width:100%;height:auto}@media (min-width:900px){#shell{display:grid;grid-template-columns:230px 1fr;align-items:start}#shell nav{flex-direction:column;position:sticky;top:0;height:calc(100vh - 70px);overflow-y:auto;border-right:1px solid var(--bd);border-bottom:0;padding:12px}#shell nav button{text-align:left}main{max-width:none;width:100%}}footer{text-align:center;color:var(--mut);font-size:.85rem;padding:16px}.srch{max-width:280px}th{background:var(--bg);font-weight:700}tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg) 55%,transparent)}.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cd{background:var(--card);border:1px solid var(--bd);border-radius:6px;min-height:84px;padding:4px;font-size:.72rem;overflow:hidden}.cd span{display:block;padding-left:4px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd.hoy{outline:2px solid var(--pri)}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style></head><body>
<div id="app"></div>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<script>
const KEY='cultivaup_v3',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d).toISOString().slice(0,10),today=()=>iso(Date.now()),ago=n=>iso(Date.now()-n*864e5);
let db,user=null,tab='panel',chartC=null;
const SC={
cultivos:{t:'Cultivos',f:[['nombre','Nombre'],['tipo','Tipo de planta'],['siembra','Siembra','date'],['cosecha_est','Cosecha estimada','date'],['estado','Estado','sel',['Activo','Cosechado','En riesgo']],['parcela','Parcela'],['resp','Responsable','ref','usuarios']]},
riegos:{t:'Riegos',f:[['cultivo','Cultivo','ref','cultivos'],['fecha','Fecha','date'],['litros','Litros','num'],['resp','Responsable','ref','usuarios'],['obs','Observaciones','text',0,1]]},
cosechas:{t:'Cosechas',f:[['cultivo','Cultivo','ref','cultivos'],['fecha','Fecha','date'],['cantidad','Cantidad','num'],['unidad','Unidad','sel',['kg','piezas','manojos']],['resp','Responsable','ref','usuarios'],['obs','Observaciones','text',0,1]]},
observaciones:{t:'Observaciones',f:[['cultivo','Cultivo','ref','cultivos'],['fecha','Fecha','date'],['texto','Observación'],['resp','Autor','ref','usuarios']]},
sensores:{t:'Sensores',f:[['cultivo','Cultivo','ref','cultivos'],['tipo','Tipo','sel',['Humedad','Temperatura']]]},
lecturas:{t:'Lecturas de sensores',f:[['sensor','Sensor','ref','sensores'],['fecha','Fecha','date'],['valor','Valor (% o °C)','num']]},
usuarios:{t:'Usuarios',f:[['nombre','Nombre'],['correo','Correo'],['rol','Rol','sel',['Administrador','Encargado','Consulta']]]},
solicitudes:{t:'Solicitudes de cambio',f:[['folio','Folio (automático)','text',0,1],['titulo','Solicitud'],['tipo','Tipo','sel',['Correctivo','Preventivo','Adaptativo','Perfectivo']],['prioridad','Prioridad','sel',['Alta','Media','Baja']],['estado','Estado','sel',['Recibida','En análisis','Aprobada','En implementación','En pruebas','Liberada','Cerrada']],['resp','Responsable','ref','usuarios'],['fecha','Fecha','date'],['version','Versión','text',0,1]]},
insumos:{t:'Inventario de insumos',f:[['nombre','Insumo'],['cat','Categoría','sel',['Semillas','Fertilizantes','Herramientas','Riego','Otros']],['existencia','Existencia','num'],['unidad','Unidad','sel',['kg','L','piezas','bolsas']],['minimo','Mínimo','num'],['prov','Proveedor','text',0,1]]},
tareas:{t:'Tareas asignadas',f:[['titulo','Tarea'],['cultivo','Cultivo','ref','cultivos'],['resp','Responsable','ref','usuarios'],['limite','Fecha límite','date'],['estado','Estado','sel',['Pendiente','En proceso','Completada']]]}};
function seed(){const U=[{id:1,nombre:'Luis Angel Silva',correo:'luis@cultivaup.demo',rol:'Administrador'},{id:2,nombre:'Rafael Guerrero',correo:'rafael@cultivaup.demo',rol:'Encargado'},{id:3,nombre:'Daniel Ruiz',correo:'daniel@cultivaup.demo',rol:'Consulta'}];
const C=[{id:10,nombre:'Jitomate saladette',tipo:'Hortaliza',siembra:ago(40),cosecha_est:ago(-35),estado:'Activo',parcela:'A1',resp:2},{id:11,nombre:'Lechuga romana',tipo:'Hoja verde',siembra:ago(20),cosecha_est:ago(-15),estado:'Activo',parcela:'B2',resp:2},{id:12,nombre:'Cilantro',tipo:'Aromática',siembra:ago(30),cosecha_est:ago(-5),estado:'Activo',parcela:'B3',resp:1}];
const d={seq:100,um:{hmin:30,hmax:80,tmin:5,tmax:35,dias:3},usuarios:U,cultivos:C,
riegos:[{id:20,cultivo:10,fecha:ago(1),litros:15,resp:2,obs:'Riego por la mañana'},{id:21,cultivo:11,fecha:ago(2),litros:8,resp:2,obs:''}],
cosechas:[{id:30,cultivo:12,fecha:ago(7),cantidad:12,unidad:'manojos',resp:1,obs:'Primera cosecha'}],
observaciones:[{id:40,cultivo:10,fecha:ago(3),texto:'Hojas inferiores con manchas leves',resp:2}],
sensores:[{id:50,cultivo:10,tipo:'Humedad'},{id:51,cultivo:10,tipo:'Temperatura'},{id:52,cultivo:11,tipo:'Humedad'}],
lecturas:[],alertas:[]};
[55,52,48,44,38,34,27].forEach((v,i)=>d.lecturas.push({id:60+i,sensor:50,fecha:ago(6-i),valor:v}));
[60,58,62].forEach((v,i)=>d.lecturas.push({id:70+i,sensor:52,fecha:ago(2-i),valor:v}));
d.alertas.push({id:80,cultivo:10,tipo:'Humedad',msg:'Humedad baja (27%)',fecha:ago(0),estado:'Pendiente',atiende:''});extend(d);return d}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}if(!db)db=seed();chkRiego();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const nm=(c,id)=>{const o=db[c].find(x=>x.id==id);return !o?(c=='cultivos'?'General':'—'):c=='sensores'?o.tipo+' · '+nm('cultivos',o.cultivo):o.nombre};
const can=c=>user&&(user.rol=='Administrador'||(user.rol=='Encargado'&&c!='usuarios'));
function addAl(c,t,m,f){if(db.alertas.some(a=>a.cultivo==c&&a.tipo==t&&a.estado=='Pendiente'&&a.msg.split(' (')[0]==m.split(' (')[0]))return;db.alertas.push({id:db.seq++,cultivo:c,tipo:t,msg:m,fecha:f,estado:'Pendiente',atiende:''})}
function evalL(l){const s=db.sensores.find(x=>x.id==l.sensor);if(!s)return;const u=db.um,v=+l.valor;let m=null;
if(s.tipo=='Humedad'){if(v<u.hmin)m='Humedad baja ('+v+'%)';else if(v>u.hmax)m='Humedad alta ('+v+'%)'}
else{if(v>u.tmax)m='Temperatura alta ('+v+' °C)';else if(v<u.tmin)m='Temperatura baja ('+v+' °C)'}
if(m)addAl(s.cultivo,s.tipo,m,l.fecha)}
function chkRiego(){db.cultivos.filter(c=>c.estado=='Activo').forEach(c=>{const r=db.riegos.filter(x=>x.cultivo==c.id).map(x=>x.fecha).sort().pop();
const dias=r?Math.floor((Date.now()-new Date(r))/864e5):999;
if(dias>=db.um.dias&&!db.alertas.some(a=>a.cultivo==c.id&&a.tipo=='Riego'&&a.estado=='Pendiente'))addAl(c.id,'Riego','Sin riego '+(dias==999?'registrado':'hace '+dias+' días'),today())});(db.insumos||[]).filter(i=>i.existencia<=i.minimo).forEach(i=>addAl(0,'Inventario','Existencia baja: '+i.nombre+' ('+i.existencia+' '+i.unidad+')',today()))}
function chart(){const c=chartC||db.cultivos[0]?.id;const ids=db.sensores.filter(s=>s.cultivo==c&&s.tipo=='Humedad').map(s=>s.id);
const L=db.lecturas.filter(l=>ids.includes(l.sensor)).sort((a,b)=>a.ts-b.ts).slice(-48);
const sel='<select id="cc" aria-label="Cultivo">'+db.cultivos.map(x=>'<option value="'+x.id+'"'+(x.id==c?' selected':'')+'>'+esc(x.nombre)+'</option>').join('')+'</select>';
if(L.length<2)return sel+'<p class="mut">Se necesitan al menos 2 lecturas de humedad para graficar.</p>';
const x=i=>30+i*(560/(L.length-1)),y=v=>160-Math.max(0,Math.min(100,v))*1.4;
return sel+'<svg viewBox="0 0 600 180" role="img" aria-label="Humedad del suelo por fecha"><line x1="30" x2="590" y1="'+y(db.um.hmin)+'" y2="'+y(db.um.hmin)+'" stroke="var(--bad)" stroke-dasharray="4"/><text x="34" y="'+(y(db.um.hmin)-4)+'" font-size="10" fill="var(--bad)">mínimo '+db.um.hmin+'%</text><polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="'+L.map((l,i)=>x(i)+','+y(l.valor)).join(' ')+'"/>'+L.map((l,i)=>'<circle cx="'+x(i)+'" cy="'+y(l.valor)+'" r="4" fill="var(--pri)"><title>'+fm(l.ts)+': '+l.valor+'%</title></circle>').join('')+'<text x="30" y="177" font-size="10" fill="var(--mut)">'+fm(L[0].ts)+'</text><text x="590" y="177" font-size="10" text-anchor="end" fill="var(--mut)">'+fm(L[L.length-1].ts)+'</text></svg>'}
function panel(){const P=db.alertas.filter(a=>a.estado=='Pendiente'),w=ago(7);
return '<div class="grid"><div class="stat"><b>'+db.cultivos.filter(c=>c.estado=='Activo').length+'</b>cultivos activos</div><div class="stat"><b>'+P.length+'</b>alertas pendientes</div><div class="stat"><b>'+db.riegos.filter(r=>r.fecha>=w).length+'</b>riegos esta semana</div><div class="stat"><b>'+db.cosechas.length+'</b>cosechas registradas</div><div class="stat"><b>'+db.sensores.length+'</b>sensores registrados</div><div class="stat"><b>'+db.lecturas.length+'</b>lecturas almacenadas</div></div>'+
'<div class="box"><h3>Alertas pendientes</h3>'+(P.map(a=>'<div class="al"><span><b>'+esc(nm('cultivos',a.cultivo))+'</b>: '+esc(a.msg)+'</span><span>'+a.fecha+'</span></div>').join('')||'<p class="mut">No hay alertas pendientes.</p>')+'</div>'+
'<div class="box"><h3>Humedad del suelo</h3>'+chart()+'</div>'+graficas()}
function list(c){const S=SC[c],w=can(c);let h='<div class="bar"><h2>'+S.t+'</h2>'+(w?'<button class="btn" data-add="'+c+'">+ Nuevo registro</button>':'<span class="mut">Solo lectura</span>')+'</div>';
const rows=[...db[c]].reverse().slice(0,300);
return h+'<input class="srch" id="q" type="search" placeholder="Buscar…" aria-label="Buscar" style="margin-bottom:10px"><div class="tw"><table><thead><tr>'+S.f.map(f=>'<th>'+f[1]+'</th>').join('')+(w?'<th></th>':'')+'</tr></thead><tbody>'+
(rows.map(r=>'<tr>'+S.f.map(f=>'<td>'+esc(f[2]=='ref'?nm(f[3],r[f[0]]):r[f[0]])+'</td>').join('')+(w?'<td><button data-ed="'+c+':'+r.id+'">Editar</button> <button class="del" data-del="'+c+':'+r.id+'">Borrar</button></td>':'')+'</tr>').join('')||'<tr><td colspan="9" class="mut">Aún no hay registros. Usa “Nuevo registro” para agregar el primero.</td></tr>')+'</tbody></table></div>'}
function alertas(){const w=can('alertas'),u=db.um;
let h='<div class="bar"><h2>Alertas</h2></div>';
if(user.rol=='Administrador')h+='<div class="box"><h3>Umbrales de alerta</h3><div class="um">'+[['hmin','Humedad mín. %'],['hmax','Humedad máx. %'],['tmin','Temp. mín. °C'],['tmax','Temp. máx. °C'],['dias','Días sin riego']].map(([k,l])=>'<label>'+l+'<input type="number" data-um="'+k+'" value="'+u[k]+'"></label>').join('')+'<button class="btn" data-saveum>Guardar umbrales</button></div></div>';
return h+'<div class="tw"><table><thead><tr><th>Fecha</th><th>Cultivo</th><th>Tipo</th><th>Detalle</th><th>Estado</th><th></th></tr></thead><tbody>'+
([...db.alertas].reverse().map(a=>'<tr><td>'+a.fecha+'</td><td>'+esc(nm('cultivos',a.cultivo))+'</td><td>'+a.tipo+'</td><td>'+esc(a.msg)+'</td><td><span class="tag'+(a.estado=='Pendiente'?' p':'')+'">'+a.estado+'</span>'+(a.atiende?'<br><small class="mut">'+esc(a.atiende)+'</small>':'')+'</td><td>'+(w&&a.estado=='Pendiente'?'<button data-at="'+a.id+'">Marcar atendida</button>':'')+'</td></tr>').join('')||'<tr><td colspan="6" class="mut">No hay alertas.</td></tr>')+'</tbody></table></div>'}
const hs=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h};
let cm=new Date();cm=new Date(cm.getFullYear(),cm.getMonth(),1);
function seedExtra(d){d.usuarios.forEach(u=>u.h=hs('Cultiva2026!'));
const S=(t,tp,p,e,r,f,v)=>({id:d.seq++,folio:'',titulo:t,tipo:tp,prioridad:p,estado:e,resp:r,fecha:ago(f),version:v||''});
d.solicitudes=[S('Riego registrado no se guarda','Correctivo','Alta','Cerrada',1,14,'1.0.1'),S('Consultas de lecturas lentas por crecimiento de datos','Preventivo','Media','En pruebas',1,9),S('Compatibilidad con nueva versión del navegador','Adaptativo','Media','Aprobada',2,6),S('Filtros por fecha, tipo de planta y responsable','Perfectivo','Baja','En análisis',2,4),S('Alerta de humedad aparece sin motivo','Correctivo','Media','En implementación',1,2),S('Botón mal acomodado en celular','Correctivo','Baja','Recibida',3,0)];
d.solicitudes.forEach((s,i)=>s.folio='SC-'+String(i+1).padStart(4,'0'));
d.insumos=[['Semilla de jitomate','Semillas',3,'bolsas',2],['Fertilizante orgánico','Fertilizantes',18,'kg',20],['Composta','Fertilizantes',120,'kg',50],['Manguera de riego','Riego',6,'piezas',3],['Goteros','Riego',40,'piezas',50],['Guantes','Herramientas',12,'piezas',6],['Semilla de lechuga','Semillas',5,'bolsas',2],['Insecticida natural','Otros',4,'L',2]].map(([n,c,e,u,m])=>({id:d.seq++,nombre:n,cat:c,existencia:e,unidad:u,minimo:m,prov:'Proveedor local'}));
const T=(t,c,r,l,e)=>({id:d.seq++,titulo:t,cultivo:c,resp:r,limite:ago(-l),estado:e});
d.tareas=[T('Regar parcela A1',10,2,0,'Pendiente'),T('Fertilizar lechuga',11,2,2,'Pendiente'),T('Cosechar cilantro',12,1,3,'En proceso'),T('Revisar sensores de la parcela C1',13,2,4,'Pendiente'),T('Retirar maleza en D1',15,1,-1,'Pendiente'),T('Trasplante de albahaca',18,2,-3,'Completada'),T('Poda de pepino',19,1,6,'Pendiente')];
d.cultivos.forEach(c=>[10,17,24,31].forEach(a=>d.riegos.push({id:d.seq++,cultivo:c.id,fecha:ago(a),litros:8+(c.id%5)*2,resp:1+c.id%2,obs:''})));
d.meta={respaldo:null}}
function bars(D,u){const m=Math.max(...D.map(x=>x[1]),1);return D.map(([k,v])=>'<div style="display:grid;grid-template-columns:130px 1fr 64px;gap:8px;align-items:center;margin:4px 0"><span>'+esc(k)+'</span><div style="background:var(--bg);border-radius:4px"><div style="width:'+(v/m*100)+'%;background:var(--pri);height:14px;border-radius:4px"></div></div><b>'+v+u+'</b></div>').join('')}
function graficas(){const W=[];for(let i=5;i>=0;i--){const a=ago(i*7+6),b=ago(i*7);W.push(['Sem. '+b.slice(5),db.riegos.filter(r=>r.fecha>=a&&r.fecha<=b).reduce((s,r)=>s+r.litros,0)])}
const K=db.cultivos.map(c=>[c.nombre,db.cosechas.filter(k=>k.cultivo==c.id).reduce((s,k)=>s+k.cantidad,0)]).filter(x=>x[1]>0),I=db.insumos.map(i=>[i.nombre,Math.round(i.existencia/Math.max(i.minimo,1)*100)]).sort((a,b)=>a[1]-b[1]).slice(0,5);
return '<div class="box"><h3>Agua aplicada por semana</h3>'+bars(W,' L')+'</div><div class="box"><h3>Cosecha por cultivo</h3>'+(K.length?bars(K,''):'<p class="mut">Sin cosechas registradas.</p>')+'</div><div class="box"><h3>Insumos con menor existencia (% del mínimo)</h3>'+bars(I,'%')+'</div>'}
function calendario(){const y=cm.getFullYear(),m=cm.getMonth(),n=new Date(y,m+1,0).getDate(),off=(cm.getDay()+6)%7,E={},add=(f,t,c)=>{(E[f]=E[f]||[]).push([t,c])};
db.riegos.forEach(r=>add(r.fecha,'Riego: '+nm('cultivos',r.cultivo),'#2f7d9a'));db.cosechas.forEach(r=>add(r.fecha,'Cosecha: '+nm('cultivos',r.cultivo),'#9a6b00'));db.cultivos.forEach(c=>add(c.cosecha_est,'Cosecha estimada: '+c.nombre,'#7a4aa0'));db.tareas.forEach(t=>add(t.limite,'Tarea: '+t.titulo,t.estado=='Completada'?'#617080':'#b3261e'));
let g='';for(let i=0;i<off;i++)g+='<div></div>';

function sistema(){const kb=Math.round(JSON.stringify(db).length/1024),R=['cultivos','riegos','cosechas','observaciones','sensores','lecturas','alertas','insumos','tareas','solicitudes','usuarios'];
return '<div class="bar"><h2>Estado del sistema</h2></div><div class="grid"><div class="stat"><b>v1.0</b>versión instalada</div><div class="stat"><b>'+kb+' KB</b>datos almacenados</div><div class="stat"><b style="font-size:1.1rem">'+(db.meta&&db.meta.respaldo?fm(db.meta.respaldo):'Nunca')+'</b>último respaldo</div><div class="stat"><b>'+db.solicitudes.filter(s=>s.estado!='Cerrada'&&s.estado!='Liberada').length+'</b>solicitudes abiertas</div></div><div class="box"><h3>Respaldo y restauración</h3><p class="mut">Descarga una copia de todos los datos o restaura una copia anterior.</p><button class="btn" data-bk>Descargar respaldo</button><label style="margin-top:12px">Restaurar desde archivo<input type="file" id="rst" accept=".json"></label></div><div class="box"><h3>Registros por módulo</h3>'+bars(R.map(k=>[k,db[k].length]),'')+'</div>'}
let mc=null,mr=60,live=true,tickN=0;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),fm=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function sig(s,t){const k=s.id*7.3,n=Math.sin(t/9e5+k)*2+Math.sin(t/2.1e5+k*2)*1.2;
if(s.tipo=='Humedad'){let v=52+14*Math.sin(t/2.5e7+k)+n;if(Math.sin(t/1.8e7+k*3)>.96)v-=30;return cl(v,5,95)}
const D=new Date(t),h=D.getHours()+D.getMinutes()/60;let v=23+8*Math.sin((h-9)*Math.PI/12)+n*.6;if(Math.sin(t/3.2e7+k*5)>.97)v+=13;return v}
function extend(d){const N=[['Chile serrano','Hortaliza','C1'],['Zanahoria','Raíz','C2'],['Calabacita','Hortaliza','D1'],['Rábano','Raíz','D2'],['Espinaca','Hoja verde','E1'],['Albahaca','Aromática','E2'],['Pepino','Hortaliza','F1']];

d.cosechas.push({id:d.seq++,cultivo:16,fecha:ago(3),cantidad:4.5,unidad:'kg',resp:2,obs:'Cosecha completa'});
const now=Date.now();d.lecturas=[];
d.sensores.forEach(s=>{for(let m=7*1440;m>=0;m-=(m>1440?60:30)){const t=now-m*6e4;d.lecturas.push({id:d.seq++,sensor:s.id,fecha:iso(t),ts:t,valor:+sig(s,t).toFixed(1)})}});seedExtra(d)}
function runs(L,lo,hi){const R=[];let c=null;L.forEach(l=>{const k=l.valor>hi?'Pico alto':l.valor<lo?'Valle bajo':null;if(k&&c&&c.k==k){if(k=='Pico alto'?l.valor>c.valor:l.valor<c.valor){c.valor=l.valor;c.ts=l.ts}}else if(k){c={k,valor:l.valor,ts:l.ts};R.push(c)}else c=null});return R}
const fmt=t=>{const d=new Date(t);return mr<=1440?d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:mr<=30?'2-digit':undefined}):d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})};
function chartTS(L,o){if(L.length<2)return '<p class="mut">Sin datos en este rango.</p>';
const W=700,H=230,pl=44,pr=12,pt=14,pb=26,v=L.map(l=>l.valor),vmin=Math.min(...v),vmax=Math.max(...v),lo=Math.min(o.lo,vmin)-3,hi=Math.max(o.hi,vmax)+3,t0=L[0].ts,t1=L[L.length-1].ts;
const X=t=>(pl+(t-t0)/(t1-t0||1)*(W-pl-pr)).toFixed(1),Y=x=>(pt+(hi-x)/(hi-lo)*(H-pt-pb)).toFixed(1);
let S=L;if(L.length>260){const st=Math.ceil(L.length/260);S=L.filter((l,i)=>i%st==0||l.valor==vmin||l.valor==vmax)}
const pmax=L.find(l=>l.valor==vmax),pmin=L.find(l=>l.valor==vmin);
let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+o.title+'">';
for(let i=0;i<=4;i++){const y=lo+(hi-lo)*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="var(--bd)"/><text x="'+(pl-6)+'" y="'+(+Y(y)+4)+'" font-size="10" text-anchor="end" fill="var(--mut)">'+y.toFixed(0)+'</text>'}
[o.lo,o.hi].forEach((y,i)=>s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(Y(y)-3)+'" font-size="10" text-anchor="end" fill="var(--bad)">'+(i?'máx ':'mín ')+y+o.u+'</text>');
s+='<polyline fill="none" stroke="var(--pri)" stroke-width="1.8" points="'+S.map(l=>X(l.ts)+','+Y(l.valor)).join(' ')+'"/>';
S.filter(l=>l.valor<o.lo||l.valor>o.hi).forEach(l=>s+='<circle cx="'+X(l.ts)+'" cy="'+Y(l.valor)+'" r="2.8" fill="var(--bad)"/>');
[[pmax,'máx'],[pmin,'mín']].forEach(([p,n])=>s+='<circle cx="'+X(p.ts)+'" cy="'+Y(p.valor)+'" r="5" fill="none" stroke="var(--tx)" stroke-width="1.5"><title>'+n+' '+p.valor+o.u+' – '+fmt(p.ts)+'</title></circle><text x="'+X(p.ts)+'" y="'+(+Y(p.valor)+(n=='máx'?-9:16))+'" font-size="11" text-anchor="middle" fill="var(--tx)">'+p.valor+o.u+'</text>');
for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;s+='<text x="'+X(t)+'" y="'+(H-6)+'" font-size="10" text-anchor="'+(i==0?'start':i==4?'end':'middle')+'" fill="var(--mut)">'+fmt(t)+'</text>'}
return s+'</svg>'}
